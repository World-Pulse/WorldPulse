name: Deploy to production

# Every push to main deploys automatically.
# To redeploy by hand: Actions tab → "Deploy to production" → Run workflow.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   SERVER_HOST     142.93.71.102
#   SERVER_SSH_KEY  private key whose public half is in the server's
#                   /root/.ssh/authorized_keys
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a deploy halfway through

jobs:
  deploy:
    # Only the repo the server pulls from deploys; the public mirror skips this.
    if: github.repository == 'World-Pulse/WorldPulse-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Missing SERVER_HOST or SERVER_SSH_KEY secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir -p ~/.ssh
          # Rebuild the key whatever copy-paste did to it. Accepts the normal key
          # text (even with joined lines / extra spaces) or a one-line base64 copy.
          raw=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            body=$(printf '%s' "$raw" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \t\n')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$body" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/deploy_key
          else
            printf '%s' "$raw" | tr -d ' \t\n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          # Fingerprint is a public ID (safe to show): compare with  ssh-keygen -lf ~/.ssh/github_deploy.pub  on the server
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key 2>&1)"
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=20 root@$HOST"
          # Retry: a busy sshd (bots guessing passwords) can drop new connections
          for i in 1 2 3 4 5; do
            if $SSH true 2>/tmp/ssh_err; then ok=1; break; fi
            echo "SSH attempt $i failed: $(tail -n 1 /tmp/ssh_err)"; sleep $((i * 6))
          done
          if [ -z "${ok:-}" ]; then
            echo "::error::Could not log in to the server: $(tail -n 1 /tmp/ssh_err). If it says 'Permission denied (publickey)', SERVER_SSH_KEY doesn't match /root/.ssh/authorized_keys."
            exit 1
          fi
          echo "SSH=$SSH" >> "$GITHUB_ENV"

      - name: Update code and start the deploy on the server
        run: |
          $SSH bash -s -- "${GITHUB_SHA::7}" <<'REMOTE'
          set -euo pipefail
          cd /opt/worldpulse
          mkdir -p logs
          # Keep a copy of any hand edits made on the server before syncing
          if ! git diff --quiet; then
            git diff > "logs/server-edits-$(date +%Y%m%d_%H%M%S).patch"
            echo "Saved server-side edits to logs/ before syncing."
          fi
          git fetch --quiet origin main
          git reset --hard --quiet origin/main
          echo starting > logs/deploy.status
          # Detached, so a dropped SSH connection can't kill the build
          setsid nohup bash scripts/server-deploy.sh "$1" > logs/deploy-latest.log 2>&1 < /dev/null &
          echo "Deploy of $1 started on the server."
          REMOTE

      - name: Wait for the deploy to finish
        run: |
          status="unknown"
          for i in $(seq 1 100); do   # up to ~50 minutes
            sleep 30
            status=$($SSH "cat /opt/worldpulse/logs/deploy.status 2>/dev/null" || echo unreachable)
            case "$status" in
              success|success_with_warnings|rolled_back|failed) break ;;
              *) echo "…still deploying ($status)" ;;
            esac
          done
          echo "──────── server deploy log ────────"
          $SSH "tail -n 80 /opt/worldpulse/logs/deploy-latest.log" || true
          echo "──────── result: $status ────────"
          case "$status" in
            success)
              echo "✅ Deployed — all checks passed." ;;
            success_with_warnings)
              echo "::error::Deployed, but something needs attention — see the log above."; exit 1 ;;
            rolled_back)
              echo "::error::The new version failed its health checks and was rolled back. The site is running the previous version."; exit 1 ;;
            *)
              echo "::error::Deploy failed or timed out (status: $status)."; exit 1 ;;
          esac
