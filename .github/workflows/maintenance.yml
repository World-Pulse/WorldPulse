name: Server maintenance

# Every day the server cleans up after itself, renews the certificate if due,
# restarts anything that stopped, and publishes /ops-status.json.
# Uses the same SERVER_HOST / SERVER_SSH_KEY secrets as the deploy.
on:
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'World-Pulse/WorldPulse-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run maintenance on the server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Rebuild the key whatever copy-paste did to it. Accepts the normal key
          # text (even with joined lines / extra spaces) or a one-line base64 copy.
          raw=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            body=$(printf '%s' "$raw" | sed 's/-----BEGIN OPENSSH PRIVATE KEY-----//; s/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \t\n')
            { echo '-----BEGIN OPENSSH PRIVATE KEY-----'; printf '%s' "$body" | fold -w 70; echo; echo '-----END OPENSSH PRIVATE KEY-----'; } > ~/.ssh/deploy_key
          else
            printf '%s' "$raw" | tr -d ' \t\n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 root@"$HOST" \
            "cd /opt/worldpulse && bash scripts/server-maintenance.sh"
