name: Autopilot

# Orbit, the WorldPulse autopilot, runs here 8 times a day (one shift per
# 3-hour slot), whether or not Devon's PC is on. GitHub sometimes starts
# scheduled runs late or skips them, so this checks every hour and runs a
# slot's shift the first time it gets the chance. GitHub dropped most of those
# hourly runs (only 12 started Oct 7-10), so Claude's hourly HQ sync also
# sends an "autopilot-tick" (repository_dispatch) whenever a slot is due or a
# shift from chat is waiting; a tick counts exactly like a scheduled run.
#
#  shift   — Claude picks one item from the plan, makes the change and checks
#            it. This job can only READ the repo, so nothing it does can reach
#            GitHub directly. scripts/autopilot-publish.sh then checks the
#            work (no secrets or protected files, no new TypeScript errors,
#            website still builds) and hands it to the publish job.
#  publish — a fresh machine that runs no code from the shift: re-checks the
#            safety rules itself, ships passing commits to main, starts the
#            deploy, and saves the report, handoffs between floors, the shift
#            ledger (with what each shift cost) and HQ data to the private
#            `autopilot-state` branch.
#
# Orbit's standing instructions and the org chart (floors, heads, who reports
# to whom) live on main in scripts/autopilot-instructions/; both jobs apply them
# to the desk at the start of every shift.
#
# While Devon's PC is on, shifts also run there in Claude (on his plan). His PC
# sends each one as two branches, autopilot/local/<stamp> (code) and
# autopilot/local-hq/<stamp> (report, plan, HQ data); the next hourly run here
# checks and ships them exactly like a cloud shift, using this file from main.
# While those shifts run, the PC refreshes autopilot/pc-online and the cloud
# skips its own slots; it takes over again once the PC goes quiet.
#
# Lanes: World Map, Engineering, Departments and a nightly QA review; the
# Sunday-night slot is the Chief of Staff's weekly planning (plan + brief).
#
# Setup: one repository secret, ANTHROPIC_API_KEY — best a key created for one
#   workspace (Settings → Secrets and variables → Actions).
# Optional controls (same page, "Variables" tab):
#   AUTOPILOT_PAUSED        true = skip all shifts until changed back
#   AUTOPILOT_BUDGET_USD    spending cap per shift in US dollars (default 3)
#   AUTOPILOT_MAX_TURNS     max Claude steps per shift (default 60)
#   AUTOPILOT_MODEL         default claude-sonnet-5-5
#   AUTOPILOT_WORKSPACE_ID  wrkspc_… — which Claude workspace an organization-wide
#                           key should bill. Optional: if unset, the autopilot
#                           looks the workspace up with the key itself.
#   AUTOPILOT_LIVE_LOG      false = hide Claude's step-by-step log in the run
# Watch a shift live: Actions tab → Autopilot → the running shift → "Run the shift".
# Run a shift now: Actions tab → Autopilot → Run workflow.
on:
  schedule:
    # Every hour. Slots start at 9 PM, 12 AM, 3 AM, 6 AM, 9 AM, 12 PM, 3 PM and
    # 6 PM New York summer time (an hour earlier in winter); the other hourly
    # runs only catch up a slot GitHub skipped, and otherwise stop in seconds.
    - cron: '7 * * * *'
  repository_dispatch:
    types: [autopilot-tick]
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which shift to run'
        type: choice
        default: auto
        options: [auto, World Map, Engineering, Departments, QA review, Weekly planning]

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  shift:
    # Only the private repo, only from main, and not while paused
    if: github.repository == 'World-Pulse/WorldPulse-v2' && github.ref == 'refs/heads/main' && vars.AUTOPILOT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.shift.outputs.ready }}
      lane: ${{ steps.shift.outputs.lane }}
      start_sha: ${{ steps.shift.outputs.start_sha }}
      stamp: ${{ steps.shift.outputs.stamp }}
      next: ${{ steps.shift.outputs.next }}
      slot_id: ${{ steps.shift.outputs.slot_id }}
      api_problem: ${{ steps.shift.outputs.api_problem }}
      mode: ${{ steps.shift.outputs.mode }}
      local_stamp: ${{ steps.shift.outputs.local_stamp }}
      claude_outcome: ${{ steps.claude.outcome }}
    env:
      TZ: America/New_York
      # Hide the API key and GitHub token from commands Claude runs
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 200

      - name: Check out the plan, reports and HQ data
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: autopilot-state
          path: .hq

      - name: Work out this shift
        id: shift
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCED_LANE: ${{ inputs.lane }}
          EVENT: ${{ github.event_name }}
          MODEL: ${{ vars.AUTOPILOT_MODEL || 'claude-sonnet-5-5' }}
          WORKSPACE_ID: ${{ vars.AUTOPILOT_WORKSPACE_ID }}
        run: |
          # An hourly tick from Claude's scheduler counts as a scheduled run
          [ "$EVENT" = repository_dispatch ] && EVENT=schedule
          ready=true; mode=cloud; local_stamp=""; local_tip=""; start_sha=$(git rev-parse HEAD)
          if [ ! -f .hq/AUTOPILOT.md ]; then
            echo "::warning::The autopilot-state branch (plan + instructions) isn't on GitHub yet, so this shift is skipped. Devon's PC publishes it within 30 minutes of being on."
            ready=false
          fi
          # The most recent scheduled slot (UTC 1,4,…,22 at :07), so a late start
          # by GitHub still runs the right lane.
          h=$((10#$(date -u +%H)))
          slot=$(( ((h + 23) % 24) / 3 * 3 + 1 ))
          day=$(date -u +%F)
          [ "$slot" -gt "$h" ] && day=$(date -u -d "$day -1 day" +%F)
          slot_ts=$(date -u -d "$day $slot:07" +%s)
          slot_id=$(date -u -d "@$slot_ts" +%Y-%m-%dT%H)
          case $slot in
            1)        # Sunday-night slot is the Chief of Staff's weekly planning
                      if [ "$(date -u -d "@$slot_ts" +%u)" = 1 ]; then lane="Weekly planning"; else lane="QA review"; fi ;;
            4|13|22)  lane="World Map" ;;
            7|16)     lane="Engineering" ;;
            *)        lane="Departments" ;;
          esac
          if [ -n "$FORCED_LANE" ] && [ "$FORCED_LANE" != auto ]; then lane="$FORCED_LANE"; fi
          # A shift done in Claude on Devon's PC is waiting: check and ship it (oldest first)
          pending=""
          if [ "$ready" = true ] && [ "$EVENT" = schedule ]; then
            pending=$(git ls-remote --heads origin 'refs/heads/autopilot/local-hq/*' 2> /dev/null | cut -f2 \
                      | sed -n 's#^refs/heads/autopilot/local-hq/\([0-9]\{4\}-[0-9][0-9]-[0-9][0-9]-[0-9]\{4\}\)$#\1#p' | sort | head -n1) || true
          fi
          if [ -n "$pending" ]; then
            mode=local; local_stamp=$pending; slot_id=""
            if git -C .hq fetch -q --depth=2 origin "refs/heads/autopilot/local-hq/$local_stamp" \
               && git -C .hq checkout -q --detach FETCH_HEAD; then
              ll=$(git -C .hq log -1 --format=%s | sed -n 's/^Local shift [0-9-]* · \([A-Za-z &]\{1,40\}\)$/\1/p') || true
              lane="Local · ${ll:-shift}"
              if git ls-remote --exit-code --heads origin "refs/heads/autopilot/local/$local_stamp" > /dev/null 2>&1; then
                if git fetch -q origin "refs/heads/autopilot/local/$local_stamp" && base=$(git merge-base FETCH_HEAD HEAD); then
                  local_tip=$(git rev-parse FETCH_HEAD); start_sha=$base
                else
                  echo "::warning::The commits from Devon's PC ($local_stamp) aren't based on main, so only the report and plan are saved."
                fi
              fi
              echo "Checking and shipping a shift done in Claude on Devon's PC ($local_stamp, $lane)."
            else
              echo "::warning::Couldn't fetch the shift $local_stamp from Devon's PC; the next hourly run tries again."
              ready=false
            fi
          fi
          if [ "$mode" = cloud ] && [ -z "$KEY" ]; then
            echo "::warning::The ANTHROPIC_API_KEY secret isn't set yet, so this shift is skipped. Add it under Settings → Secrets and variables → Actions."
            ready=false
          fi
          # One shift per slot: the extra hourly runs only catch up a missed slot
          if [ "$ready" = true ] && [ "$mode" = cloud ] && [ "$EVENT" = schedule ] && [ "$(cat .hq/last-slot 2> /dev/null)" = "$slot_id" ]; then
            echo "This slot's shift already ran; the next one starts at $(date -d "@$((slot_ts + 10800))" '+%-I:%M %p')."
            ready=false
          fi
          # Shifts are running in Claude on Devon's PC: leave the slot to them
          if [ "$ready" = true ] && [ "$mode" = cloud ] && [ "$EVENT" = schedule ] \
             && git fetch -q --depth=1 origin refs/heads/autopilot/pc-online 2> /dev/null; then
            ct=$(git log -1 --format=%ct FETCH_HEAD 2> /dev/null || true)
            age=$(( $(date +%s) - ${ct:-0} ))
            if [ "$age" -lt 6000 ]; then
              echo "Shifts are running in Claude on Devon's PC (it checked in $((age / 60)) min ago), so the cloud leaves this slot to it and takes over once the PC goes quiet."
              ready=false
            fi
          fi
          # Make sure Claude answers before starting (a 1-token request). An
          # organization-wide key has to name a workspace on every request: use
          # AUTOPILOT_WORKSPACE_ID if set, otherwise look the workspace up with the key.
          api_problem=""
          [ "$mode" = local ] && pinged=skip || pinged=""
          ping() {  # ping [workspace-id] → HTTP status; the reply is in /tmp/api-check.json
            local h=(-H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json")
            [ -n "${1:-}" ] && h+=(-H "anthropic-workspace-id: $1")
            curl -sS -o /tmp/api-check.json -w '%{http_code}' --max-time 60 "${h[@]}" \
              -d "$(printf '{"model":"%s","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}' "$MODEL")" \
              https://api.anthropic.com/v1/messages 2> /dev/null || true
          }
          api_error() { python3 -c 'import json; print(json.load(open("/tmp/api-check.json"))["error"]["message"])' 2> /dev/null || true; }
          if [ "$ready" = true ] && [ -z "$pinged" ]; then
            ws="$WORKSPACE_ID"
            code=$(ping "$ws")
            if [ "$code" = 400 ] && [ -z "$ws" ] && [[ "$(api_error)" == *anthropic-workspace-id* ]]; then
              # Prefer a workspace named for WorldPulse or the autopilot, else Default
              ws=$(curl -sS --max-time 30 -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" \
                     "https://api.anthropic.com/v1/organizations/workspaces?include_default=true&limit=100" 2> /dev/null \
                   | python3 -c '
          import json, re, sys
          ws = [w for w in (json.load(sys.stdin).get("data") or []) if isinstance(w, dict)
                and str(w.get("id", "")).startswith("wrkspc_") and not w.get("archived_at")
                and not re.search(r"claude code", str(w.get("name", "")), re.I)]
          pick = (next((w for w in ws if re.search(r"worldpulse|world pulse|autopilot", str(w.get("name", "")), re.I)), None)
                  or next((w for w in ws if str(w.get("name", "")).lower() == "default"), None)
                  or (ws[0] if ws else None))
          print(pick["id"] + " " + str(pick.get("name", "")) if pick else "")
          ' 2> /dev/null) || true
              if [ -n "$ws" ]; then
                echo "This key works across workspaces; using workspace '${ws#* }' (${ws%% *})."
                ws="${ws%% *}"
                code=$(ping "$ws")
              else
                api_problem="This key works across workspaces and its workspace couldn't be looked up: add the GitHub variable AUTOPILOT_WORKSPACE_ID"
              fi
            fi
            if [ -z "$api_problem" ]; then
              case "$code" in
                200)
                  echo "Claude API check passed."
                  # Claude Code sends this header on every request (the action passes it through)
                  [ -n "$ws" ] && echo "ANTHROPIC_CUSTOM_HEADERS=anthropic-workspace-id: $ws" >> "$GITHUB_ENV" ;;
                400|401|402|403|404)
                  api_problem=$(api_error | tr -d '\r\n' | cut -c1-240) || true
                  api_problem="${api_problem:-HTTP $code}" ;;
                *)
                  echo "::warning::Claude isn't answering right now (HTTP ${code:-none}); the next hourly run tries this shift again."
                  ready=false ;;
              esac
            fi
            [ -n "$api_problem" ] && echo "::error::The Claude API turned the autopilot away: $api_problem"
            rm -f /tmp/api-check.json
          fi
          git config --global user.name "WorldPulse Autopilot"
          git config --global user.email "autopilot@world-pulse.io"
          # Bring the desk up to date with main before Claude reads it: standing
          # instructions and org chart (scripts/autopilot-instructions), files the
          # pipeline keeps. Left uncommitted: it travels with the shift's own edits,
          # and the publish job applies it again.
          hq_base=$(git -C .hq rev-parse HEAD 2> /dev/null || true)
          [ "$mode" = local ] && hq_base=$(git -C .hq rev-parse HEAD~1 2> /dev/null || true)
          if [ "$ready" = true ]; then
            if migrated=$(cd .hq && python3 "$GITHUB_WORKSPACE/scripts/autopilot_hq.py" migrate "$GITHUB_WORKSPACE/scripts/autopilot-instructions" 2>&1); then
              [ -n "$migrated" ] && echo "Desk updated from main: $migrated"
            else
              echo "::warning::Couldn't apply the instructions and org chart from main: $migrated"
              git -C .hq checkout -q -- . 2> /dev/null || true; git -C .hq clean -qfd 2> /dev/null || true
            fi
          fi
          {
            echo "ready=$ready"
            echo "slot_id=$slot_id"
            echo "api_problem=$api_problem"
            echo "lane=$lane"
            echo "start_sha=$start_sha"
            echo "hq_base=$hq_base"
            echo "mode=$mode"
            echo "local_stamp=$local_stamp"
            echo "local_tip=$local_tip"
            if [ "$mode" = local ]; then echo "stamp=$local_stamp"; else echo "stamp=$(date +%Y-%m-%d-%H%M)"; fi
            echo "now=$(date '+%A %B %-d, %Y, %-I:%M %p %Z')"
            echo "next=$(date -d "@$((slot_ts + 10800))" '+%-I:%M %p')"
          } >> "$GITHUB_OUTPUT"
          # .hq is a separate repository; keep it out of the code repo
          echo ".hq/" >> .git/info/exclude
          echo "Shift: $lane ($(date)) · ready=$ready · $mode"

      - uses: actions/setup-node@v6
        if: steps.shift.outputs.ready == 'true' && (steps.shift.outputs.mode != 'local' || steps.shift.outputs.local_tip != '')
        with:
          node-version: 20   # same major as the production Docker images

      - name: Install pnpm
        if: steps.shift.outputs.ready == 'true' && (steps.shift.outputs.mode != 'local' || steps.shift.outputs.local_tip != '')
        run: |
          npm install -g pnpm@9.12.0 > /dev/null
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore the package cache
        if: steps.shift.outputs.ready == 'true' && (steps.shift.outputs.mode != 'local' || steps.shift.outputs.local_tip != '')
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        if: steps.shift.outputs.ready == 'true' && (steps.shift.outputs.mode != 'local' || steps.shift.outputs.local_tip != '')
        continue-on-error: true
        run: |
          if pnpm install --frozen-lockfile; then
            echo yes > /tmp/lockfile-in-sync
          else
            echo "Lockfile is out of date; installing without it"
            pnpm install --no-frozen-lockfile
            git checkout -- pnpm-lock.yaml 2> /dev/null || true
          fi
          pnpm --filter @worldpulse/types build || true

      # Claude Code needs bubblewrap to hide the API key and GitHub token from the
      # commands it runs (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB above); without it the
      # shift won't start (Oct 10, 2026).
      - name: Install the sandbox that hides secrets from Claude's commands
        if: steps.shift.outputs.ready == 'true' && steps.shift.outputs.api_problem == '' && steps.shift.outputs.mode != 'local'
        continue-on-error: true
        run: |
          command -v bwrap > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap > /dev/null; }
          if bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true; then
            echo "bubblewrap works"
          else
            echo "::warning::bubblewrap is installed but can't run on this runner, so Claude Code may refuse to start."
          fi

      - name: Run the shift
        id: claude
        if: steps.shift.outputs.ready == 'true' && steps.shift.outputs.api_problem == '' && steps.shift.outputs.mode != 'local'
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Step-by-step log while the shift runs, and a readable report after
          show_full_output: ${{ vars.AUTOPILOT_LIVE_LOG != 'false' }}
          display_report: 'true'
          prompt: |
            You are Orbit, the WorldPulse autopilot, running in GitHub Actions.
            Shift: ${{ steps.shift.outputs.lane }} · started ${{ steps.shift.outputs.now }} · next shift ${{ steps.shift.outputs.next }}.
            Read .hq/AUTOPILOT.md and follow it exactly.
            Write this shift's report to .hq/reports/${{ steps.shift.outputs.stamp }}.md.
          claude_args: |
            --model ${{ vars.AUTOPILOT_MODEL || 'claude-sonnet-5-5' }}
            --max-turns ${{ vars.AUTOPILOT_MAX_TURNS || '60' }}
            --max-budget-usd ${{ vars.AUTOPILOT_BUDGET_USD || '3' }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,WebFetch,WebSearch,TodoWrite"
            --disallowedTools "Bash(git push:*),Bash(gh:*),Bash(curl:*),Bash(wget:*),Bash(ssh:*),Bash(scp:*)"

      - name: Check out the commits from Devon's PC
        if: ${{ !cancelled() && steps.shift.outputs.ready == 'true' && steps.shift.outputs.local_tip != '' }}
        env:
          TIP: ${{ steps.shift.outputs.local_tip }}
        run: git checkout -q --detach "$TIP"

      - name: Check the work
        if: ${{ !cancelled() && steps.shift.outputs.ready == 'true' }}
        timeout-minutes: 30
        env:
          START: ${{ steps.shift.outputs.start_sha }}
          HQ_BASE: ${{ steps.shift.outputs.hq_base }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          STAMP: ${{ steps.shift.outputs.stamp }}
          LANE: ${{ steps.shift.outputs.lane }}
          SHIFT_OUT: /tmp/shift-out
        # The checks as they were when the shift started
        run: |
          git show "$START:scripts/autopilot-publish.sh" > /tmp/autopilot-publish.sh
          bash /tmp/autopilot-publish.sh check

      - name: Hand the work to the publish job
        if: ${{ !cancelled() && steps.shift.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: shift-${{ github.run_id }}
          path: /tmp/shift-out
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true   # a re-run replaces the earlier attempt's work

  publish:
    needs: shift
    if: ${{ !cancelled() && needs.shift.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # push to main and to autopilot-state
      actions: write    # start the deploy workflow
    env:
      TZ: America/New_York
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 200

      - name: Check out the plan, reports and HQ data
        uses: actions/checkout@v6
        with:
          ref: autopilot-state
          path: .hq
          fetch-depth: 0

      - name: Collect the shift's work
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: shift-${{ github.run_id }}
          path: /tmp/shift-out

      - name: Ship it and save the shift
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ needs.shift.outputs.start_sha }}
          STAMP: ${{ needs.shift.outputs.stamp }}
          LANE: ${{ needs.shift.outputs.lane }}
          NEXT_SHIFT: ${{ needs.shift.outputs.next }}
          SLOT_ID: ${{ needs.shift.outputs.slot_id }}
          API_PROBLEM: ${{ needs.shift.outputs.api_problem }}
          CLAUDE_OUTCOME: ${{ needs.shift.outputs.claude_outcome }}
          SHIFT_MODE: ${{ needs.shift.outputs.mode }}
          LOCAL_STAMP: ${{ needs.shift.outputs.local_stamp }}
          SHIFT_OUT: /tmp/shift-out
        # Runs the shipping script as it was when the shift started; no code
        # from the shift runs here
        run: |
          echo ".hq/" >> .git/info/exclude
          git show "$START:scripts/autopilot-publish.sh" > /tmp/autopilot-publish.sh
          bash /tmp/autopilot-publish.sh publish
