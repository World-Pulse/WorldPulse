# ─────────────────────────────────────────────────────────────────────────────
#  WorldPulse — nginx virtual hosts
#  Server:  142.93.71.102
#  Domains: world-pulse.io (canonical)  |  world-pulse.app → 301 → world-pulse.io
#  API:     api.world-pulse.io
#
#  Cert paths:
#    /etc/letsencrypt/live/world-pulse.io/   — covers .io + www.io + api.io
#    /etc/letsencrypt/live/world-pulse.app/  — covers .app + www.app
# ─────────────────────────────────────────────────────────────────────────────

# ─── Bots that ignore robots.txt get 403 ─────────────────────────────────────
# Devon, Oct 21, 2026: "Yes proceed to block it". robots.txt has asked AionBot
# to stay away since Oct 19 (apps/web/src/app/robots.ts); it kept reading
# anyway (6,677 pages between 8 PM ET on Oct 20 and 7:25 AM the next morning)
# and sends no readers. It may still read robots.txt itself. Answers other
# than 200/304 don't count as page views (scripts/readers.py).
map "$http_user_agent|$uri" $blocked_bot {
    default                          0;
    "~*aionbot[^|]*\|/robots\.txt$"  0;
    "~*aionbot"                      1;
}

# ─── Pages per reader ─────────────────────────────────────────────────────────
# Plan D3, Oct 21, 2026: the site's own server now asks the API over the
# private network, outside the API's per-address limits
# (apps/api/src/lib/site-calls.ts), so pages are limited here instead, per
# reader: 20 a second, a burst of 100 (a page and its prefetches stay far
# below). A runaway client is turned away on its own (429), instead of using
# up a budget every reader shared.
limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;

# ─── Pages kept for a minute (Oct 23, 2026; launch Monday Oct 26) ────────────
# Next renders every page on every request (the root layout is dynamic), about
# 0.2 s of the one web process each, so a launch-day crowd would queue behind
# it, and while a deploy swaps the web container nginx answered 502. Now nginx
# keeps each page's HTML for 60 seconds per address and menu language, renews
# it in the background with one request at a time, and serves the kept copy
# while the web app restarts or fails. Kept: plain page views (GET and HEAD)
# with a 200, redirect or 404. Never kept: Next's in-app navigation data (RSC
# requests, which carry the headers below) and answers that set a cookie.
# Sign-in lives in the browser (localStorage), so every visitor gets the same
# HTML; the menus' language comes from the wp_lang cookie, part of the key.
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=page_cache:20m max_size=512m inactive=30m use_temp_path=off;

map "$http_rsc$http_next_router_prefetch$http_next_router_state_tree$http_next_router_segment_prefetch" $page_cache_skip {
    default 1;
    ""      0;
}

# ─── HTTP — ACME challenge passthrough + HTTPS redirect ──────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name world-pulse.io
                www.world-pulse.io
                api.world-pulse.io
                world-pulse.app
                www.world-pulse.app;

    # Let's Encrypt ACME challenge (served from Docker volume)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Health check — returns 200 directly (no redirect) for Docker healthcheck
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── world-pulse.app + www → canonical world-pulse.io redirect ───────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name world-pulse.app www.world-pulse.app;

    ssl_certificate     /etc/letsencrypt/live/world-pulse.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-pulse.app/privkey.pem;

    # Permanent redirect — all traffic to the canonical .io domain
    return 301 https://world-pulse.io$request_uri;
}

# ─── www.world-pulse.io → apex redirect ──────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.world-pulse.io;

    ssl_certificate     /etc/letsencrypt/live/world-pulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-pulse.io/privkey.pem;

    return 301 https://world-pulse.io$request_uri;
}

# ─── FRONTEND — world-pulse.io ───────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name world-pulse.io;

    ssl_certificate     /etc/letsencrypt/live/world-pulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-pulse.io/privkey.pem;

    client_max_body_size 55M;
    limit_conn conn_limit 50;

    if ($blocked_bot) { return 403; }

    # No canonical header here: sent on every response, it told search engines
    # that every page was a copy of the home page. Pages name their own address
    # (apps/web/src/lib/page-metadata.ts; plan G2, Oct 11, 2026).

    # ── Static uploads — served directly from shared Docker volume ────────────
    location /uploads/ {
        alias   /var/www/uploads/;
        expires 1d;
        add_header Cache-Control    "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
        try_files $uri =404;
    }

    # ── Next.js static bundle — aggressively cached ──────────────────────────
    location /_next/static/ {
        proxy_pass http://worldpulse_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Next.js image optimisation ───────────────────────────────────────────
    location /_next/image {
        proxy_pass         http://worldpulse_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Server status for the autopilot (non-secret; written by scripts/ops-status.sh)
    location = /ops-status.json {
        access_log  off;
        alias       /var/www/ops/status.json;
        default_type application/json;
        add_header  Cache-Control "no-store";
    }

    # ── Health check (no access log noise) ───────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass       http://worldpulse_web;
        proxy_set_header Host $host;
    }

    # ── Main app ─────────────────────────────────────────────────────────────
    location / {
        limit_req          zone=pages burst=100 nodelay;
        limit_req_status   429;

        proxy_pass         http://worldpulse_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        # The web app answers uncompressed and nginx compresses (gzip above), so
        # one kept copy serves every browser whatever it accepts
        proxy_set_header   Accept-Encoding    "";
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Pages kept for a minute (see page_cache at the top). Next marks every
        # page no-store and varies it by its RSC headers; RSC requests skip the
        # cache entirely, so those headers are set aside for the rest.
        proxy_cache                   page_cache;
        proxy_cache_key               "$scheme$host$request_uri|$cookie_wp_lang";
        proxy_cache_valid             200 301 302 308 60s;
        proxy_cache_valid             404 10s;
        proxy_cache_bypass            $page_cache_skip;
        proxy_no_cache                $page_cache_skip;
        proxy_ignore_headers          Cache-Control Expires Vary;
        proxy_cache_lock              on;
        proxy_cache_lock_timeout      10s;
        proxy_cache_background_update on;
        proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;

        # An add_header here stops the http-level ones from reaching this
        # location, so they are repeated; X-Page-Cache says HIT, MISS, BYPASS,
        # STALE or UPDATING
        add_header X-Frame-Options           $frame_options                     always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header X-XSS-Protection          "1; mode=block"                    always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy        "geolocation=(), microphone=()"    always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Page-Cache              $upstream_cache_status             always;

        # Share pictures (link previews on X, LinkedIn…): a story's took 4.9 s to
        # draw on Oct 23. Kept 30 minutes: their address carries a hash of what
        # they show. Everything else is inherited from this location.
        location ~ /(opengraph|twitter)-image {
            proxy_pass        http://worldpulse_web;
            proxy_cache_valid 200 30m;
        }
    }
}

# ─── API — api.world-pulse.io ────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name api.world-pulse.io;

    ssl_certificate     /etc/letsencrypt/live/world-pulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-pulse.io/privkey.pem;

    client_max_body_size 55M;
    limit_conn conn_limit 100;

    if ($blocked_bot) { return 403; }

    # ── Auth — strict rate limit ──────────────────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password) {
        limit_req        zone=auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://worldpulse_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── File uploads ──────────────────────────────────────────────────────────
    location /api/v1/uploads {
        limit_req        zone=uploads burst=5 nodelay;

        proxy_pass         http://worldpulse_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass            http://worldpulse_api;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass       http://worldpulse_api;
        proxy_set_header Host $host;
    }

    # ── General API ───────────────────────────────────────────────────────────
    location / {
        limit_req        zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass         http://worldpulse_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        # NOTE: Must be "" (not $http_connection) when using keepalive upstream pool.
        # Passing $http_connection from HTTP/2 clients sends an empty Connection header
        # which signals the upstream to close the socket — this breaks the keepalive pool
        # and causes 502s on the first request after a container restart.
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      16 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
    }
}
